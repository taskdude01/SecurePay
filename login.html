<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login – SecurePay</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-logo">
      <div class="logo-circle">S</div>
      <h1>SecurePay</h1>
    </div>

    <div class="auth-card">
      <h2>Login</h2>
      <p class="auth-sub">Welcome back to SecurePay</p>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>

      <button class="btn btn-primary btn-full" id="loginBtn" onclick="loginUser()">Login</button>

      <p class="auth-footer-text" style="margin-top:20px;">
        New user? <a href="register.html" style="color:var(--primary);">Create Account</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    window.loginUser = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        alert('Please enter email and password');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
        alert('Login failed: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>
</body>
</html>
