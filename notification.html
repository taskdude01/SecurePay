<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Notifications – SecurePay</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 20px 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
    }
    .notification-item {
      display: flex;
      gap: 14px;
      padding: 16px 20px;
      max-width: 480px;
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .notif-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 208, 156, 0.15);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .notif-content {
      flex: 1;
    }
    .notif-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 3px;
    }
    .notif-time {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container" style="padding-bottom: 40px;">

    <div class="page-header">
      <a href="dashboard.html" class="back-btn">←</a>
      <div>
        <div style="font-weight:700; font-size:1.2rem;">Notifications</div>
        <div style="font-size:0.85rem; color:var(--text-secondary);">Your recent alerts</div>
      </div>
    </div>

    <div id="notificationList">
      <div class="empty-state">Loading notifications...</div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const container = document.getElementById('notificationList');

      try {
        // Get recent transactions as notifications
        const q1 = query(collection(db, "transactions"), where("fromUserId", "==", user.uid));
        const q2 = query(collection(db, "transactions"), where("toUserId", "==", user.uid));

        const [sentSnap, receivedSnap] = await Promise.all([getDocs(q1), getDocs(q2)]);

        let notifications = [];

        sentSnap.forEach(doc => {
          const data = doc.data();
          notifications.push({
            title: `You paid ₹${data.amount} to ${data.toName}`,
            time: data.createdAt,
            type: 'sent'
          });
        });

        receivedSnap.forEach(doc => {
          const data = doc.data();
          notifications.push({
            title: `You received ₹${data.amount} from ${data.fromName}`,
            time: data.createdAt,
            type: 'received'
          });
        });

        // Sort newest first
        notifications.sort((a, b) => new Date(b.time) - new Date(a.time));

        if (notifications.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p>No notifications yet</p>
              <p style="font-size:0.85rem; margin-top:8px;">Your payment alerts will appear here</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        notifications.slice(0, 20).forEach(notif => {
          const date = new Date(notif.time);
          const timeText = date.toLocaleString('en-IN', {
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
          });

          const icon = notif.type === 'sent' ? '↑' : '↓';

          container.innerHTML += `
            <div class="notification-item">
              <div class="notif-icon">${icon}</div>
              <div class="notif-content">
                <div class="notif-title">${notif.title}</div>
                <div class="notif-time">${timeText}</div>
              </div>
            </div>
          `;
        });

      } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="empty-state"><p>Could not load notifications</p></div>`;
      }
    });
  </script>
</body>
</html>
