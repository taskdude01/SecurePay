<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Audit Ledger – SecurePay</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 20px 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
    }
    .ledger-info {
      max-width: 440px;
      margin: 0 auto 20px;
      padding: 16px;
      background: rgba(0, 208, 156, 0.08);
      border: 1px solid rgba(0, 208, 156, 0.25);
      border-radius: 14px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .ledger-item {
      max-width: 480px;
      margin: 0 auto 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .ledger-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .block-number {
      background: #00D09C;
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .tx-amount {
      font-weight: 700;
      font-size: 1.1rem;
      color: #00D09C;
    }
    .ledger-row {
      font-size: 0.82rem;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .ledger-row span {
      color: var(--text-secondary);
    }
    .hash {
      font-family: monospace;
      font-size: 0.75rem;
      background: rgba(255,255,255,0.05);
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container" style="padding-bottom: 40px;">

    <div class="page-header">
      <a href="dashboard.html" class="back-btn">←</a>
      <div>
        <div style="font-weight:700; font-size:1.2rem;">Audit Ledger</div>
        <div style="font-size:0.85rem; color:var(--text-secondary);">Tamper-proof transaction chain</div>
      </div>
    </div>

    <div class="ledger-info">
      Every transaction is hashed using SHA-256 and linked to the previous one. 
      Changing any past record will break the chain.
    </div>

    <div id="ledgerList">
      <div style="text-align:center; padding:40px; color:var(--text-secondary);">
        Loading audit ledger...
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from './js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      loadLedger();
    });

    async function loadLedger() {
      const container = document.getElementById('ledgerList');

      try {
        const q = query(collection(db, "auditLedger"), orderBy("index", "asc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="empty-state">
              <p>No audit records yet</p>
              <p style="font-size:0.85rem; margin-top:8px;">Send money to create the first ledger entry</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';

        snapshot.forEach(doc => {
          const data = doc.data();

          container.innerHTML += `
            <div class="ledger-item">
              <div class="ledger-header">
                <div class="block-number">Block #${data.index}</div>
                <div class="tx-amount">₹${Number(data.amount).toLocaleString('en-IN')}</div>
              </div>

              <div class="ledger-row"><span>From:</span> ${data.fromName}</div>
              <div class="ledger-row"><span>To:</span> ${data.toName}</div>
              ${data.note ? `<div class="ledger-row"><span>Note:</span> ${data.note}</div>` : ''}
              <div class="ledger-row"><span>Time:</span> ${new Date(data.timestamp).toLocaleString('en-IN')}</div>

              <div class="ledger-row" style="margin-top:10px;">
                <span>Previous Hash:</span>
                <div class="hash">${data.previousHash}</div>
              </div>

              <div class="ledger-row">
                <span>Current Hash (SHA-256):</span>
                <div class="hash">${data.currentHash}</div>
              </div>
            </div>
          `;
        });

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-state">
            <p>Failed to load audit ledger</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
